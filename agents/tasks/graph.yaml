epics:
  E0:
    title: Bootstrap
    goal: workspace, CI gates, control harness skeleton, conventions enforced
  E1:
    title: Field and polynomial core
    goal: M31/CM31/QM31/OM31/KoalaBear, MLEs, eq tables, bucketed partial evaluation, SIMD
  E2:
    title: Hash, Merkle, transcript
    goal: Blake3 sponge transcript, labels, short-column Merkle, Poseidon2-M31
  E3:
    title: Sumcheck engine
    goal: generic degree<=4 sumcheck, strategies, batching, verifier, ledger lines
  E4:
    title: Codes and PCS
    goal: circle RS and RAA encoders, interleaved-code PCS, functional + fused openings, blinding, Ligerito mode
  E5:
    title: CQIS
    goal: quantiser, tables, certificates, bit-exact reference, fidelity harness
  E6:
    title: Tensor IR and witness
    goal: lowering, stacking, plan.json, witness capture and recompute
  E7:
    title: Reductions (CPU reference)
    goal: every op reduction with tests and controls
  E8:
    title: End-to-end CPU on tiny model
    goal: GPT-2-small proof+verify, controls corpus v1, ledger v1
  E9:
    title: Four-phase orchestration at 8B
    goal: residual cuts, stacked phases, fused weight openings; W1 on CPU
  E10:
    title: GPU backend
    goal: CUDA kernels with parity; W1 <= 10 s on one H100
  E11:
    title: Scale and distribution
    goal: 70B/405B/DeepSeek-V3 multi-GPU; W4 <= 3 min on 8xH100
  E12:
    title: Treaty profile
    goal: ZK, double-challenge LogUp, OM31 decision, proven PCS params, passport, binding spec, audit readiness
  E13:
    title: Architecture coverage
    goal: GQA, MoE, MLA, windows, softcap, QK-norm, sampling, multi-turn chaining
  E14:
    title: Recursion wrapper
    goal: compact certificates via M31-native STARK wrapper; checkpoint-binding proof
  E15:
    title: Research tracks
    goal: RFC-0019 spikes (DPA, EPOCH, OCTIC, LIGERITO, BF16, FORMAL, SUBSAMPLE, TABLES, SERVE)
  E16:
    title: Development-profile end-to-end
    goal: non-ZK prefill-window proof with greedy exact-match over committed integer columns (RFC-0026)
  E17:
    title: Measurement and ladder (lane B)
    goal: stage counters, scoreboard, real gates, scripted remote hosts (RFC-0027 §3)
  E18:
    title: Relation IR v2 (lane P)
    goal: commit rule, virtual columns, segments, stacked weight phase; gate M2 (RFC-0028)
  E19:
    title: Commitment scheme v3 (lane C)
    goal: circle sources in the engine, recursive opening, certified model sources (RFC-0029)
  E20:
    title: Engine and GPU (lane E)
    goal: typed columns, lookup fast path, backend trait, CUDA kernels with parity; gate M4
  E21:
    title: Verifier and admission (lane V)
    goal: security accounting, verifier crate, Python verifier, standard admission, passport, formal statements; gates M3 and M7 (RFC-0030)
  E22:
    title: Numerics and models (lane N)
    goal: accounting, 8B modules and first light, proof-friendly CQIS, MoE, sampling; gates M1 and M6
  E23:
    title: Zero knowledge (lane Z)
    goal: bounded-query encodings, committed masks, opening budget, leak list; gate M5 (RFC-0013 A3)
