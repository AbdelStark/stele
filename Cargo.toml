[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
disallowed_types = "deny"
unwrap_used = "warn"
panic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
