[workspace]
resolver = "2"
members = ["crates/*", "tests/negative-controls"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
float_arithmetic = "forbid"
disallowed_types = "forbid"
unwrap_used = "warn"
panic = "warn"

# RFC-0020 §4-5: accelerate tests while retaining runtime safety checks.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
