# RFC-0020 §2: only these crates may directly import each workspace crate.
# Cargo aliases resolve to the package name before these checks.
# Leaf entries allow only self-imports, which Cargo rejects as cycles.
[bans]
multiple-versions = "deny"
deny = [
  { name = "stwo" },
  { name = "plonky3" },
  { name = "halo2_proofs" },
  { name = "stele-bench", wrappers = ["stele-cli"] },
  { name = "stele-cli", wrappers = ["stele-cli"] },
  { name = "stele-code", wrappers = ["stele-pcs"] },
  { name = "stele-cqis", wrappers = ["stele-ir", "stele-passport"] },
  { name = "stele-dist", wrappers = ["stele-dist"] },
  { name = "stele-field", wrappers = ["stele-code", "stele-cqis", "stele-hash", "stele-kernels", "stele-poly", "stele-proof", "stele-simd", "stele-verifier"] },
  { name = "stele-gkr", wrappers = ["stele-lookup", "stele-reductions"] },
  { name = "stele-gpu", wrappers = ["stele-dist"] },
  { name = "stele-hash", wrappers = ["stele-pcs", "stele-sumcheck", "stele-verifier", "stele-negative-controls"] },
  { name = "stele-ir", wrappers = ["stele-reductions"] },
  { name = "stele-kernels", wrappers = ["stele-gpu"] },
  { name = "stele-lookup", wrappers = ["stele-reductions"] },
  { name = "stele-negative-controls", wrappers = ["stele-negative-controls"] },
  { name = "stele-passport", wrappers = ["stele-cli"] },
  { name = "stele-pcs", wrappers = ["stele-passport", "stele-reductions"] },
  { name = "stele-poly", wrappers = ["stele-sumcheck"] },
  { name = "stele-proof", wrappers = ["stele-prover"] },
  { name = "stele-prover", wrappers = ["stele-bench", "stele-cli", "stele-gpu", "stele-py"] },
  { name = "stele-py", wrappers = ["stele-py"] },
  { name = "stele-reductions", wrappers = ["stele-prover"] },
  { name = "stele-simd", wrappers = ["stele-code", "stele-poly"] },
  { name = "stele-sumcheck", wrappers = ["stele-gkr"] },
  { name = "stele-verifier", wrappers = ["stele-cli", "stele-py", "stele-wrapper"] },
  { name = "stele-wrapper", wrappers = ["stele-passport"] },
]
