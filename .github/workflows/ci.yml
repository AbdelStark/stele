name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.scope.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - uses: actions/cache@v4
        id: cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo deny --offline check bans
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 research/r-octic/check_modulus.py
      - run: python3 research/cqis-rounding/check_rounding.py
      - run: python3 research/poseidon2/check_poseidon2.py
      - run: uv run --locked --script research/transcript/check_transcript.py
      - run: uv run --locked --script research/merkle/check_merkle.py
      - run: uv run --locked --script research/sumcheck/check_sumcheck.py
      - run: uv run --locked --script research/batching/check_batching.py
      - run: uv run --locked --script research/zerocheck/check_zerocheck.py
      - run: python3 research/stacked-gkr/check_stacking.py
      - run: scripts/gates/rust-policy.sh
      - run: cargo build --workspace --locked --offline
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      # shortcut: hosted AVX-512 varies; use a dedicated runner for mandatory per-head coverage.
      - name: Native x86 SIMD parity
        env:
          STELE_REQUIRE_SIMD: avx2
        run: cargo test -p stele-simd --release --locked --offline -- --nocapture
      - run: cargo test --workspace --locked --offline
      - run: cargo test -p stele-sumcheck --example batching --locked --offline
      - run: cargo test -p stele-sumcheck --example zerocheck --locked --offline
      - run: cargo clippy -p stele-hash --all-targets --all-features --locked --offline -- -D warnings
      - run: scripts/gates/digest.sh
      - run: scripts/gates/negative-controls.sh
      - run: scripts/gates/soundness-accounting.sh
      - run: scripts/gates/ledger-validate.sh
      - run: scripts/gates/rfc-status.sh
      - run: scripts/gates/docs-links.sh
      - run: scripts/gates/glossary-lint.sh
  poseidon2-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Regenerate pinned upstream Poseidon2 vectors
        run: |
          cargo +1.95.0 run --manifest-path vendor-ref/poseidon2-m31/Cargo.toml --example vectors --locked > "$RUNNER_TEMP/poseidon2.jsonl"
          cmp research/poseidon2/reference.jsonl "$RUNNER_TEMP/poseidon2.jsonl"
  simd-throughput:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fetch --locked
      - name: Native parity and throughput ledger
        env:
          STELE_REQUIRE_SIMD: avx2
        run: python3 bench/simd_ops.py "$RUNNER_TEMP/simd-ops.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simd-throughput
          path: ${{ runner.temp }}/simd-ops.json
          if-no-files-found: error
  gpu-parity:
    needs: gates
    if: needs.gates.outputs.gpu == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gates/parity.sh
  nightly-w1:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p stele-cli --release --features cuda -- bench --workload W1 --profile treaty --ledger bench/ledger/nightly-${{ github.sha }}.json
