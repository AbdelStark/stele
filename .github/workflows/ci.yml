    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_residual_sign.py --maximum
  residual-rounding-full:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_residual_rounding.py --maximum
  residual-composition-full:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_residual_composition.py --maximum
  poseidon2-reference:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Regenerate pinned upstream Poseidon2 vectors
        run: |
          cargo +1.95.0 run --manifest-path vendor-ref/poseidon2-m31/Cargo.toml --example vectors --locked > "$RUNNER_TEMP/poseidon2.jsonl"
          cmp research/poseidon2/reference.jsonl "$RUNNER_TEMP/poseidon2.jsonl"
  simd-throughput:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fetch --locked
      - name: Native parity and throughput ledger
        env:
          STELE_REQUIRE_SIMD: avx2
        run: python3 bench/simd_ops.py "$RUNNER_TEMP/simd-ops.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simd-throughput
          path: ${{ runner.temp }}/simd-ops.json
          if-no-files-found: error
  gpu-parity:
    needs: gates
    if: needs.gates.outputs.gpu == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gates/parity.sh
  nightly-w1:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p stele-cli --release --features cuda -- bench --workload W1 --profile treaty --ledger bench/ledger/nightly-${{ github.sha }}.json
