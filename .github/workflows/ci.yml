          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_norm_sign.py --maximum
  norm-statistic-full:
