name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.scope.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - uses: actions/cache@v4
        id: cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo deny --offline check bans
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 research/r-octic/check_modulus.py
      - run: python3 research/cqis-rounding/check_rounding.py
      - run: python3 research/cqis-tables/check_tables.py
      - run: python3 research/cqis-tables/check_exp.py
      - run: python3 research/cqis-tables/check_activations.py
      - run: python3 research/cqis-tables/check_gelu.py
      - run: python3 research/cqis-tables/check_rmsnorm.py
      - run: python3 research/cqis-tables/check_wide_exp.py
      - run: uv run --locked --script research/cqis-tables/check_identity.py
      - run: uv run --locked --script research/cqis-tables/check_functions.py
      - run: uv run --locked --script research/cqis-tables/check_table_bindings.py
      - run: python3 research/cqis-tables/check_native_arithmetic.py
      - run: python3 research/cqis-tables/check_native_exp.py
      - run: uv run --locked --script research/cqis-tables/check_native_exp_functions.py
      - run: uv run --locked --script research/cqis-tables/check_native_fixed_gathers.py
      - run: uv run --locked --script research/cqis-tables/check_native_rmsnorm.py
      - run: uv run --locked --script research/cqis-tables/check_native_activations.py
      - run: uv run --locked --script research/cqis-tables/check_native_tanh_gelu.py
      - run: uv run --locked --script research/cqis-tables/check_native_exact_gelu.py
      - run: python3 research/cqis-bounds/check_bounds.py
      - run: uv run --locked --script research/cqis-bounds/check_limbs.py
      - run: uv run --locked --script research/cqis-bounds/check_requant.py
      - run: uv run --locked --script research/cqis-bounds/check_norm_bounds.py
      - run: uv run --locked --script research/cqis-bounds/check_encoding.py
      - run: python3 research/cqis-checkpoint/check_scalars.py
      - run: python3 research/cqis-checkpoint/check_quantiser.py
      - run: uv run --locked --script research/cqis-checkpoint/check_alignment.py
      - run: uv run --locked --script research/cqis-checkpoint/check_records.py
      - run: uv run --locked --script research/cqis-checkpoint/check_artifact.py
      - run: uv run --locked --script research/cqis-checkpoint/check_source.py
      - run: uv run --locked --script research/cqis-checkpoint/check_shards.py
      - name: Pinned checkpoint source preparation
        run: |
          curl -fsSL --retry 3 --max-time 60 https://huggingface.co/hf-internal-testing/tiny-random-gpt2/resolve/71034c5d8bde858ff824298bdedc65515b97d2b9/model.safetensors -o "$RUNNER_TEMP/cqis-source.safetensors"
          uv run --locked --script research/cqis-checkpoint/check_source.py --checkpoint "$RUNNER_TEMP/cqis-source.safetensors"
          uv run --locked --script research/cqis-checkpoint/check_shards.py --checkpoint "$RUNNER_TEMP/cqis-source.safetensors"
      - run: uv run --locked --script harness/cqis/check_arithmetic.py
      - run: python3 research/poseidon2/check_poseidon2.py
      - run: uv run --locked --script research/transcript/check_transcript.py
      - run: uv run --locked --script research/merkle/check_merkle.py
      - run: uv run --locked --script research/sumcheck/check_sumcheck.py
      - run: uv run --locked --script research/batching/check_batching.py
      - run: uv run --locked --script research/zerocheck/check_zerocheck.py
      - run: python3 research/stacked-gkr/check_stacking.py
      - run: python3 research/stacked-gkr/check_public_mle.py
      - run: python3 research/stacked-gkr/check_ownership.py
      - run: python3 research/stacked-gkr/check_statement.py
      - run: uv run --locked --script research/stacked-gkr/check_weighted_mle.py
      - run: uv run --locked --script research/stacked-gkr/check_stage.py
      - run: python3 research/small-value/check_grid.py
      - run: uv run --locked --script research/small-value/check_small_value.py
      - run: uv run --locked --script research/streaming/check_windows.py
      - run: uv run --locked --script research/streaming/check_source.py
      - run: python3 research/code-provenance/check_code.py
      - run: python3 research/code-provenance/check_expander.py
      - run: uv run --locked --script research/code-provenance/check_recursive.py
      - run: uv run --locked --script research/code-provenance/check_sampler.py
      - run: uv run --locked --script research/code-provenance/check_identity.py
      - run: uv run --locked --script research/code-provenance/check_proximity.py
      - run: uv run --locked --script research/code-provenance/check_certified.py
      - run: python3 research/packing/check_packing.py
      - run: uv run --locked --script research/packing/check_fused.py
      - run: python3 research/commitment-privacy/check_privacy.py
      - run: python3 research/private-verifier/check_boundary.py
      - run: python3 research/logup-characteristic/check_characteristic.py
      - run: uv run --locked --script research/logup-characteristic/check_units.py
      - run: uv run --locked --script research/logup-characteristic/check_fraction.py
      - run: uv run --locked --script research/logup-characteristic/check_lookup.py
      - run: uv run --locked --script research/code-provenance/check_bounded.py
      - run: uv run --locked --script research/code-provenance/check_measurement.py
      - run: python3 research/circle-code/check_circle.py
      - run: scripts/gates/rust-policy.sh
      - run: cargo build --workspace --locked --offline
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      # shortcut: hosted AVX-512 varies; use a dedicated runner for mandatory per-head coverage.
      - name: Native x86 SIMD parity
        env:
          STELE_REQUIRE_SIMD: avx2
        run: cargo test -p stele-simd --release --locked --offline -- --nocapture
      - run: cargo test --workspace --locked --offline
      - name: Native CQIS public-table MLE parity
        run: cargo run -p stele-cqis --example table_mle_parity --release --locked --offline
      - run: cargo test -p stele-sumcheck --example batching --locked --offline
      - run: cargo test -p stele-sumcheck --example zerocheck --locked --offline
      - run: cargo test -p stele-sumcheck --example small_bench --locked --offline
      - run: cargo test -p stele-code --example circle_bench --locked --offline
      - run: cargo test -p stele-sumcheck --features std --example streaming_bench --locked --offline
      - run: cargo check -p stele-sumcheck --no-default-features --locked --offline
      - run: cargo check -p stele-lookup --no-default-features --locked --offline
      - run: cargo check -p stele-cqis --no-default-features --locked --offline
      - run: cargo clippy -p stele-sumcheck --all-targets --all-features --locked --offline -- -D warnings
      - run: cargo clippy -p stele-hash --all-targets --all-features --locked --offline -- -D warnings
      - run: scripts/gates/digest.sh
      - run: scripts/gates/negative-controls.sh
      - run: scripts/gates/soundness-accounting.sh
      - run: scripts/gates/ledger-validate.sh
      - run: scripts/gates/rfc-status.sh
      - run: scripts/gates/docs-links.sh
      - run: scripts/gates/glossary-lint.sh
  poseidon2-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Regenerate pinned upstream Poseidon2 vectors
        run: |
          cargo +1.95.0 run --manifest-path vendor-ref/poseidon2-m31/Cargo.toml --example vectors --locked > "$RUNNER_TEMP/poseidon2.jsonl"
          cmp research/poseidon2/reference.jsonl "$RUNNER_TEMP/poseidon2.jsonl"
  simd-throughput:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fetch --locked
      - name: Native parity and throughput ledger
        env:
          STELE_REQUIRE_SIMD: avx2
        run: python3 bench/simd_ops.py "$RUNNER_TEMP/simd-ops.json"
      - uses: actions/upload-artifact@v4
        with:
          name: simd-throughput
          path: ${{ runner.temp }}/simd-ops.json
          if-no-files-found: error
  gpu-parity:
    needs: gates
    if: needs.gates.outputs.gpu == 'true'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gates/parity.sh
  nightly-w1:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: cargo run -p stele-cli --release --features cuda -- bench --workload W1 --profile treaty --ledger bench/ledger/nightly-${{ github.sha }}.json
