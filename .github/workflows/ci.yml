name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.scope.outputs.gpu }}
      research: ${{ steps.research.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: scope
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"
      - id: research
        run: python3 scripts/research_ci.py --matrix >> "$GITHUB_OUTPUT"
  native:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - uses: actions/cache@v4
        id: cargo-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo deny --offline check bans
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: scripts/gates/rust-policy.sh
      - run: cargo build --workspace --locked --offline
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      # shortcut: hosted AVX-512 varies; use a dedicated runner for mandatory per-head coverage.
      - name: Native x86 SIMD parity
        env:
          STELE_REQUIRE_SIMD: avx2
        run: cargo test -p stele-simd --release --locked --offline -- --nocapture
      - run: cargo test --workspace --locked --offline
      - name: Native CQIS public-table MLE parity
        run: cargo run -p stele-cqis --example table_mle_parity --release --locked --offline
      - run: cargo test -p stele-sumcheck --example batching --locked --offline
      - run: cargo test -p stele-sumcheck --example zerocheck --locked --offline
      - run: cargo test -p stele-sumcheck --example small_bench --locked --offline
      - run: cargo test -p stele-code --example circle_bench --locked --offline
      - run: cargo test -p stele-sumcheck --features std --example streaming_bench --locked --offline
      - run: cargo check -p stele-sumcheck --no-default-features --locked --offline
      - run: cargo check -p stele-lookup --no-default-features --locked --offline
      - run: cargo check -p stele-cqis --no-default-features --locked --offline
      - run: cargo clippy -p stele-sumcheck --all-targets --all-features --locked --offline -- -D warnings
      - run: cargo clippy -p stele-hash --all-targets --all-features --locked --offline -- -D warnings
      - run: scripts/gates/digest.sh
      - run: scripts/gates/negative-controls.sh
      - run: scripts/gates/soundness-accounting.sh
      - run: scripts/gates/ledger-validate.sh
      - run: scripts/gates/rfc-status.sh
      - run: scripts/gates/docs-links.sh
      - run: scripts/gates/glossary-lint.sh
  research:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.research) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: cargo fetch --locked
      - run: python3 scripts/research_ci.py --group "${{ matrix.group }}"
  gates:
    needs: [plan, native, research, range-capacity, norm-product-full, norm-sign-full, norm-statistic-full, norm-quotient-product-full, norm-bias-full, norm-division-full, norm-left-full, norm-signed-output-full, norm-configured-output-full, norm-composition-full, residual-aligned-full, residual-sign-full, residual-rounding-full, residual-composition-full]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ needs.plan.outputs.gpu }}
    steps:
      - name: Require complete native and research checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          RESEARCH_RESULT: ${{ needs.research.result }}
          CAPACITY_RESULT: ${{ needs.range-capacity.result }}
          PRODUCT_RESULT: ${{ needs.norm-product-full.result }}
          SIGN_RESULT: ${{ needs.norm-sign-full.result }}
          RESIDUAL_COMPOSITION_RESULT: ${{ needs.residual-composition-full.result }}
          RESIDUAL_ROUNDING_RESULT: ${{ needs.residual-rounding-full.result }}
          RESIDUAL_SIGN_RESULT: ${{ needs.residual-sign-full.result }}
          RESIDUAL_ALIGNED_RESULT: ${{ needs.residual-aligned-full.result }}
          COMPOSITION_RESULT: ${{ needs.norm-composition-full.result }}
          CONFIGURED_OUTPUT_RESULT: ${{ needs.norm-configured-output-full.result }}
          SIGNED_OUTPUT_RESULT: ${{ needs.norm-signed-output-full.result }}
          LEFT_RESULT: ${{ needs.norm-left-full.result }}
          DIVISION_RESULT: ${{ needs.norm-division-full.result }}
          BIAS_RESULT: ${{ needs.norm-bias-full.result }}
          STATISTIC_RESULT: ${{ needs.norm-statistic-full.result }}
          QUOTIENT_RESULT: ${{ needs.norm-quotient-product-full.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$RESEARCH_RESULT" = success
          test "$CAPACITY_RESULT" = success
          test "$PRODUCT_RESULT" = success
          test "$SIGN_RESULT" = success
          test "$RESIDUAL_COMPOSITION_RESULT" = success
          test "$RESIDUAL_ROUNDING_RESULT" = success
          test "$RESIDUAL_SIGN_RESULT" = success
          test "$RESIDUAL_ALIGNED_RESULT" = success
          test "$COMPOSITION_RESULT" = success
          test "$CONFIGURED_OUTPUT_RESULT" = success
          test "$SIGNED_OUTPUT_RESULT" = success
          test "$LEFT_RESULT" = success
          test "$DIVISION_RESULT" = success
          test "$BIAS_RESULT" = success
          test "$STATISTIC_RESULT" = success
          test "$QUOTIENT_RESULT" = success
  range-capacity:
    needs: plan
    name: range-capacity-${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [wide, signed, normxy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_range_capacity.py --${{ matrix.mode }}
  norm-product-full:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false
      - run: uv run --locked --script research/cqis-bounds/check_norm_product.py --maximum
  norm-sign-full:
    needs: plan
