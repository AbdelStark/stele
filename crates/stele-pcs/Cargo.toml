[package]
name = "stele-pcs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-pcs (see RFC-0010)"

[dependencies]
stele-poly = { path = "../stele-poly" }
stele-code = { path = "../stele-code" }
stele-field = { path = "../stele-field" }
stele-hash = { path = "../stele-hash" }
# Prover-side column blocks (E16-23, ADR-105); only through the opt-in `std` feature.
rayon = { version = "=1.10.0", optional = true }

# Prover-side parallel encoding (E16-17, ADR-090); off by default, verifiers stay no_std.
[features]
std = ["stele-code/std", "dep:rayon"]
# ADR-108: Policy 2 sources (RFC-0010 A14) resolve only with this feature; without it
# every Policy 2 constructor, `from_bytes` with policy byte 2 included, is UnsupportedSource.
standard-unproven = ["stele-code/standard-unproven"]

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
