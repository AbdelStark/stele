[package]
name = "stele-pcs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-pcs (see RFC-0010)"

[dependencies]
stele-poly = { path = "../stele-poly" }
stele-code = { path = "../stele-code" }
stele-field = { path = "../stele-field" }
stele-hash = { path = "../stele-hash" }

# Prover-side parallel encoding (E16-17, ADR-090); off by default, verifiers stay no_std.
[features]
std = ["stele-code/std"]

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
