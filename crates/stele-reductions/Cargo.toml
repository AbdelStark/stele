[package]
name = "stele-reductions"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-reductions (see RFC-0007 RFC-0008 RFC-0009 RFC-0017)"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
stele-cqis = { path = "../stele-cqis" }
stele-field = { path = "../stele-field" }
stele-hash = { path = "../stele-hash" }
stele-sumcheck = { path = "../stele-sumcheck" }
stele-gkr = { path = "../stele-gkr" }
stele-lookup = { path = "../stele-lookup" }
stele-pcs = { path = "../stele-pcs" }
stele-poly = { path = "../stele-poly" }
stele-ir = { path = "../stele-ir" }

# Prover-side threads for dense sumcheck rounds (RFC-0006 A1 prover only; E16-15).
# Off by default: the crate and its verifiers stay no_std.
[features]
std = ["stele-sumcheck/std", "stele-pcs/std"]
# Negative controls' and privacy tests' adversaries (never a verifier input).
controls = ["stele-sumcheck/controls"]

[lints]
workspace = true
