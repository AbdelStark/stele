[package]
name = "stele-sumcheck"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-sumcheck (see RFC-0006)"

[dependencies]
stele-field = { path = "../stele-field" }
stele-poly = { path = "../stele-poly" }
stele-hash = { path = "../stele-hash" }
# Prover-side work pool (E16-17, ADR-090); only through the opt-in `std` feature.
rayon = { version = "=1.10.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0"

[features]
std = ["dep:rayon"]

[[test]]
name = "file_source"
required-features = ["std"]

[[example]]
name = "streaming_bench"
required-features = ["std"]
