[package]
name = "stele-cqis"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-cqis (see RFC-0004)"

[dependencies]
stele-field = { path = "../stele-field" }
# The exact int8 dot kernel of the reference forward (RFC-0020 A16).
stele-simd = { path = "../stele-simd" }
blake3 = { version = "=1.8.7", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }

[features]
# Hosts: the rotation table is regenerated on scoped threads. Same digest.
std = []

[dev-dependencies]
serde_json = "=1.0.154"

[lints]
workspace = true
