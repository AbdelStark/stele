[package]
name = "stele-lookup"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-lookup (see RFC-0008)"

[dependencies]
stele-poly = { path = "../stele-poly" }
stele-gkr = { path = "../stele-gkr" }
stele-hash = { path = "../stele-hash" }
stele-sumcheck = { path = "../stele-sumcheck" }

[dev-dependencies]
stele-field = { path = "../stele-field" }
# Run this crate's tests through the threaded prover paths too (E16-17).
stele-sumcheck = { path = "../stele-sumcheck", features = ["std"] }
serde_json = "1.0"

[lints]
workspace = true
