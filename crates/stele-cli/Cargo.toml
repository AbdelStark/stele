[package]
name = "stele-cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-cli (see RFC-0020)"

[features]
cuda = ["dep:stele-gpu", "stele-gpu/cuda"]

[dependencies]
stele-gpu = { path = "../stele-gpu", optional = true }
stele-prover = { path = "../stele-prover" }
stele-verifier = { path = "../stele-verifier" }
stele-passport = { path = "../stele-passport" }
stele-bench = { path = "../stele-bench" }

[lints]
workspace = true

[[bin]]
name = "stele"
path = "src/main.rs"
