[package]
name = "stele-code"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Stele — stele-code (see RFC-0010 §3)"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
stele-field = { path = "../stele-field" }
stele-simd = { path = "../stele-simd" }
# Prover-side row groups (E16-17, ADR-090); only through the opt-in `std` feature.
rayon = { version = "=1.10.0", optional = true }

[features]
# ADR-108: the standard-profile path of `registry::resolve_pcs` (RFC-0010 A14). Only
# tests and negative controls enable it until E8-05 checks a composed standard proof.
standard-unproven = []
# E16-34: blake3's `std` adds runtime SIMD detection (AVX2/AVX-512 on x86_64). aarch64
# already gets NEON from blake3's build script. Same digests.
std = ["dep:rayon", "blake3/std"]

[lints]
workspace = true
